[package]
name = "conv"
version = "0.1.0"
edition = "2021"
authors = ["ChematWalid"]
description = "Universal Smart Converter CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ChematWalid/anyconv"
keywords = ["converter", "cli", "media", "document", "pandoc", "ffmpeg"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
which = "7.0"
infer = "0.16"
glob = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"
colored = "2.2"
anyhow = "1.0"
thiserror = "2.0"
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
